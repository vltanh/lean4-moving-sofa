name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read # Read access to repository contents

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
      - name: Check that the audit imports every module of the libraries
        run: >-
          diff <(find MovingSofaOptimality MovingSofaUniqueness MovingSofaBridge -name '*.lean'
          | sed 's/\.lean$//; s#/#.#g' | sort)
          <(grep '^import all MovingSofa' scripts/Audit.lean | sed 's/^import all //' | sort)
      - name: Audit axioms and dependencies
        run: lake env lean scripts/Audit.lean
      # The audit wrote each numbered result's route (.lake/route_deps.tsv); compare the routes with the
      # results that the paper's proofs cite. Every difference is recorded with its reason.
      - name: Check that the proofs follow the routes of the paper's proofs
        run: >-
          python3 scripts/route_check.py check docs/paper_routes.tsv
          --accept docs/route_differences.tsv
      - name: Check the Challenge's copy of the shared definitions
        run: python3 scripts/sync_challenge_defs.py --check
      - name: Check that the documentation's links to the code are current
        run: python3 scripts/linkify_docs.py --check
      - name: Check the Markdown tables
        run: python3 scripts/check_md_tables.py README.md REPORT.md CREDITS.md docs/*.md docs/proof/*.md
