<svg xmlns="http://www.w3.org/2000/svg" width="624" height="506" viewBox="0 0 624 506" role="img" aria-label="The triangle 0 ≤ φ ≤ θ ≤ π/4 in the (φ, θ)-plane. Its edges φ = 0 and φ = θ (purple) carry no solution. On the part φ ≤ 1/2 (orange) ∂Q/∂φ is negative, and the corner φ ≥ 1/2 (grey) has no solution. On the segment φ = 1/20 (green) Q increases in θ up to a negative value at θ = π/4. In the thin strip φ ≤ 1/20 (blue) the partial derivatives of F and H have their signs; the zero set of Q, a curve from the origin to the top edge, lies in it, and Gerver's angles (φ, θ) are a point of it">
<title>The triangle 0 ≤ φ ≤ θ ≤ π/4 in the (φ, θ)-plane. Its edges φ = 0 and φ = θ (purple) carry no solution. On the part φ ≤ 1/2 (orange) ∂Q/∂φ is negative, and the corner φ ≥ 1/2 (grey) has no solution. On the segment φ = 1/20 (green) Q increases in θ up to a negative value at θ = π/4. In the thin strip φ ≤ 1/20 (blue) the partial derivatives of F and H have their signs; the zero set of Q, a curve from the origin to the top edge, lies in it, and Gerver's angles (φ, θ) are a point of it</title>
