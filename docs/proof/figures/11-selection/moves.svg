<svg xmlns="http://www.w3.org/2000/svg" width="1168" height="321" viewBox="0 0 1168 321" role="img" aria-label="Two copies of a polygon cap K with angle set {ω/2}, ω = 1, inside the dashed parallelogram, with its polygon niche in orange. Left: the height at the normal t = ω/2 is raised by ε; the cap gains a strip along its edge of length sigma, and the niche a strip along its side of length tau on the inner wall. Right: the height at π/2 is raised by ε, which moves both lines of the horizontal strip up by ε; the new cap K′ and its niche are dashed">
<title>Two copies of a polygon cap K with angle set {ω/2}, ω = 1, inside the dashed parallelogram, with its polygon niche in orange. Left: the height at the normal t = ω/2 is raised by ε; the cap gains a strip along its edge of length sigma, and the niche a strip along its side of length tau on the inner wall. Right: the height at π/2 is raised by ε, which moves both lines of the horizontal strip up by ε; the new cap K′ and its niche are dashed</title>
