<svg xmlns="http://www.w3.org/2000/svg" width="701" height="346" viewBox="0 0 701 346" role="img" aria-label="A polygon cap K with angle set {ω/4, ω/2, 3ω/4}, ω = 1, with its polygon niche in orange and the three wedge endpoints W_K(t) on the floor. The niche meets the bottom edge of the cap, from O to the vertex A, in the segment from O to the rightmost wedge endpoint W*; the rest of the edge, in green, has length tau_K(π/2) = w_K(t*), which is at least the infimum of the wedge gaps w_K(t)">
<title>A polygon cap K with angle set {ω/4, ω/2, 3ω/4}, ω = 1, with its polygon niche in orange and the three wedge endpoints W_K(t) on the floor. The niche meets the bottom edge of the cap, from O to the vertex A, in the segment from O to the rightmost wedge endpoint W*; the rest of the edge, in green, has length tau_K(π/2) = w_K(t*), which is at least the infimum of the wedge gaps w_K(t)</title>
