<svg xmlns="http://www.w3.org/2000/svg" width="636" height="332" viewBox="0 0 636 332" role="img" aria-label="A maximum polygon cap K for ω = 1.3 and the uniform angle set with four intervals, in blue, with its niche in orange. The ends W_K(t), t ∈ Θ, of the wedges on the x-axis are marked, with the gaps w_K(t) to A below the axis. The part of the bottom side right of every W_K(t) avoids the niche (green); it has the length of the top side (green), by balancedness">
