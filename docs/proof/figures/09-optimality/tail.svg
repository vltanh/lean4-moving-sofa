<svg xmlns="http://www.w3.org/2000/svg" width="674" height="269" viewBox="0 0 674 269" role="img" aria-label="A close-up of the right tail of the niche of Gerver's sofa. The dashed triangle has vertices x_K^R = X_B, W_K^R and W_B. The part of the niche to the right of the line b_K^R, orange, is the triangle minus the body B; the tangent segments of B, a fan at X_B and then segments from the tail b_B down to the x-axis, sweep it">
