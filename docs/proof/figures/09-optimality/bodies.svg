<svg xmlns="http://www.w3.org/2000/svg" width="819" height="367" viewBox="0 0 819 367" role="img" aria-label="The cap K of Gerver's sofa, blue, between the x-axis and the line y = 1, with its niche shaded orange. The green bodies B and D are the parts of K on the far sides of the inner walls b_K(t), t from phi to pi/2, and d_K(t), t from 0 to phi^L; the dashed lines are b_K^R and d_K^L. The tails b_B and d_D, green, are the lower boundaries of B and D, and the core x_K on [phi, phi^L], orange, joins their ends x_K^R = X_B and x_K^L = Y_D">
