<svg xmlns="http://www.w3.org/2000/svg" width="600" height="402" viewBox="0 0 600 402" role="img" aria-label="The core part of the niche of Gerver's sofa, between the lines b_K^R and d_K^L (dashed) and under the core x_K on [phi, phi^L], orange. Together with the grey trapezoid below the x-axis it forms the region between the core and the line y = -H, which every vertical line meets in a single segment, since the first coordinate of x_K decreases">
