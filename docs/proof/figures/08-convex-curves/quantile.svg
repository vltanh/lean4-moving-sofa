<svg xmlns="http://www.w3.org/2000/svg" width="977" height="452" viewBox="0 0 977 452" role="img" aria-label="Left: the normalized distribution function r = F(t) of the surface area measure on (a, b) for the body K of Figure 8.2; it rises along the ellipse, jumps at t1 and t2 by the lengths of the two edges, and is flat on (t1, t2), the normal angles of the corner P. Right: the arc with thirteen points gamma(j/12) at equal arc length; the generalized inverse of F gives the normal angle at each point">
