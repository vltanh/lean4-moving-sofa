<svg xmlns="http://www.w3.org/2000/svg" width="704" height="510" viewBox="0 0 704 510" role="img" aria-label="A convex body K, the convex hull of an ellipse and a point P, and the arc u_K^{a,b} of its boundary from v_K^+(a) to v_K^-(b), drawn thick; it runs along the ellipse, an edge, the corner P, a second edge and the ellipse again. The region swept by the segment from the origin O to a point moving along the arc is shaded; its two darker triangles are the contributions of the edges. A supporting line l_K(t) and its distance h_K(t) from O are marked">
