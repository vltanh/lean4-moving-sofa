<svg xmlns="http://www.w3.org/2000/svg" width="536" height="311" viewBox="0 0 536 311" role="img" aria-label="A convex body K: the unit disk cut by a horizontal line at the bottom and by a chord with normal angle π/4. From the vertex v⁺(a), a = -π/6, to the vertex v⁺(b), b = 3π/4, the boundary is a chain of small vectors v_t dt along the arcs and one vector of length 1.2 along the chord; their sum is v⁺(b) - v⁺(a)">
