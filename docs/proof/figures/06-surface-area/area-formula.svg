<svg xmlns="http://www.w3.org/2000/svg" width="561" height="434" viewBox="0 0 561 434" role="img" aria-label="A convex pentagon K cut into five triangles with a common apex at an interior point c, one over each edge. The triangle over the edge with normal angle t has base σ_K({t}), the length of the edge, and height h_K(t) - ⟨c, u_t⟩, the distance from c to the edge, so the area of K is the sum of the halves of their products">
<title>A convex pentagon K cut into five triangles with a common apex at an interior point c, one over each edge. The triangle over the edge with normal angle t has base σ_K({t}), the length of the edge, and height h_K(t) - ⟨c, u_t⟩, the distance from c to the edge, so the area of K is the sum of the halves of their products</title>
