<svg xmlns="http://www.w3.org/2000/svg" width="535" height="433" viewBox="0 0 535 433" role="img" aria-label="The supporting hallway L(t) of the polygon cap drawn upright, with the polygon niche shaded orange. Near the corner x(t), the inner wall b(t) runs above the line d(t - δ) down to p: that part lies in R. Further down it crosses the quadrant Q⁻(t - δ), and then runs between the lines b(t - δ) and b(t + δ) from B₋ to B₊: that part lies in S. The side of the niche on b(t), thick, is the union of the two parts">
<title>The supporting hallway L(t) of the polygon cap drawn upright, with the polygon niche shaded orange. Near the corner x(t), the inner wall b(t) runs above the line d(t - δ) down to p: that part lies in R. Further down it crosses the quadrant Q⁻(t - δ), and then runs between the lines b(t - δ) and b(t + δ) from B₋ to B₊: that part lies in S. The side of the niche on b(t), thick, is the union of the two parts</title>
