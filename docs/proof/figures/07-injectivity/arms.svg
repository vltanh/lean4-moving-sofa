<svg xmlns="http://www.w3.org/2000/svg" width="589" height="417" viewBox="0 0 589 417" role="img" aria-label="The cap of Gerver's sofa and its supporting hallway at t = 0.6: the outer walls a(t) and c(t) meet at y(t) and touch the cap at A(t) and C(t), at the distances f(t) = 1.655 and g(t) = 2.014 from y(t). The inner walls, dashed, meet at x(t), whose velocity x'(t), drawn at half scale, is the sum of -(f(t) - 1) u_t and (g(t) - 1) v_t">
