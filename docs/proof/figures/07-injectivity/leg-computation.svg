<svg xmlns="http://www.w3.org/2000/svg" width="552" height="393" viewBox="0 0 552 393" role="img" aria-label="The supporting hallway L(t) of a polygon cap drawn upright, with the walls c(t - δ) and d(t - δ) of the hallway at the previous angle, dashed. The line d(t - δ) meets the inner wall b(t) at p and the wall d(t) at q, and c(t - δ) meets c(t) at the vertex r = C⁻(t). The segment from p to the corner x(t) is the part of the inner wall above d(t - δ); it is the side of the right triangle p q x(t) opposite to the angle δ at q">
<title>The supporting hallway L(t) of a polygon cap drawn upright, with the walls c(t - δ) and d(t - δ) of the hallway at the previous angle, dashed. The line d(t - δ) meets the inner wall b(t) at p and the wall d(t) at q, and c(t - δ) meets c(t) at the vertex r = C⁻(t). The segment from p to the corner x(t) is the part of the inner wall above d(t - δ); it is the side of the right triangle p q x(t) opposite to the angle δ at q</title>
