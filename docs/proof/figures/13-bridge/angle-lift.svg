<svg xmlns="http://www.w3.org/2000/svg" width="761" height="325" viewBox="0 0 761 325" role="img" aria-label="Left: a continuous path of rigid motions m(t), t from 0 to 1, applied to a pennant in the hallway: it slides along the horizontal side, turns the corner and leaves along the vertical side, spinning clockwise by five quarter turns; the pennant is drawn at nine times, darker as t grows. Right: the lifted angle ϑ(t), a continuous function decreasing from 0 to −5π/2, and the principal argument of the first column of m(t), dashed, which agrees with it until it reaches −π and then jumps to π">
