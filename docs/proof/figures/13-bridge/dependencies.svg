<svg xmlns="http://www.w3.org/2000/svg" width="1011" height="404" viewBox="0 0 1011 404" role="img" aria-label="A diagram of the twelve theorems of the Challenge in three rows: Baek's five above, formal-conjectures' four in the middle, the bridge's three below. Arrows lead from a theorem to the theorems of formal-conjectures whose proofs in Solution.lean use it: gerver_params_exists and gerver_sofa_optimal to the three theorems about Gerver's sofa, gerver_sofa_unique to the congruence theorem, isMovingSofa_iff to the first and the third of them, sofaConstant_eq to the second and the third, and gerversSofa_eq to all three; a dashed arrow leads from ABφθSpec.existsUnique, which defines Gerver's constants, to gerversSofa_eq. gerver_params_unique and gerver_sofa_area have no arrows">
