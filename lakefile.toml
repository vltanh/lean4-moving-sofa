name = "MovingSofa"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["MovingSofa", "SofaUniqueness", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"

[[lean_lib]]
name = "MovingSofa"
globs = ["MovingSofa.+"]

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"

# The uniqueness of Gerver's sofa: the modules that the final theorem imports.
# The other files under SofaUniqueness/ (the formal-conjectures adapter and earlier
# drafts) are not part of this library and are not built.
[[lean_lib]]
name = "SofaUniqueness"
roots = ["SofaUniqueness.Draft.ShapeUniqueness"]

# No source exporter or external reference-proof dependency is needed.
# The exact upstream Gerver-reference proof is tracked separately: the
# inspected existing provider uses a decision tactic prohibited for this work.
[[lean_lib]]
name = "SofaIntegration"
roots = ["SofaSubmission.Model", "SofaSubmission.Extremal", "SofaSubmission.Uniqueness", "SofaSubmission.Final", "SofaSubmission.SharedChallenge", "SofaSubmission.ChallengeUniqueness"]
globs = ["SofaSubmission.Model", "SofaSubmission.Extremal", "SofaSubmission.Uniqueness", "SofaSubmission.Final", "SofaSubmission.SharedChallenge", "SofaSubmission.ChallengeUniqueness"]
