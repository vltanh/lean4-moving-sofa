name = "MovingSofa"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["MovingSofaOptimality", "MovingSofaUniqueness", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"

# The formalization of Baek's paper "Optimality of Gerver's sofa".
[[lean_lib]]
name = "MovingSofaOptimality"
globs = ["MovingSofaOptimality.+"]

# The uniqueness of Gerver's sofa, in the definitions of MovingSofaOptimality.
[[lean_lib]]
name = "MovingSofaUniqueness"
globs = ["MovingSofaUniqueness.+"]

# The adapter to formal-conjectures' statement (in progress; not a default target).
[[lean_lib]]
name = "MovingSofaUniquenessFC"
globs = ["MovingSofaUniquenessFC.+"]

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
