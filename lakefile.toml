name = "MovingSofa"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["MovingSofaOptimality", "MovingSofaUniqueness", "MovingSofaBridge",
  "ChallengeDefs", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"

# The formalization of Baek's paper "Optimality of Gerver's sofa".
[[lean_lib]]
name = "MovingSofaOptimality"
globs = ["MovingSofaOptimality.+"]

# The uniqueness of Gerver's sofa, in the definitions of MovingSofaOptimality.
[[lean_lib]]
name = "MovingSofaUniqueness"
globs = ["MovingSofaUniqueness.+"]

# The bridge between the definitions of formal-conjectures and those of Baek's paper.
[[lean_lib]]
name = "MovingSofaBridge"
globs = ["MovingSofaBridge.+"]

# In-progress, uncompiled stability proof source. Deliberately NOT a default target.
# Its declarations are not part of the existing kernel-verification claim.
[[lean_lib]]
name = "MovingSofaStability"
globs = ["MovingSofaStability.+"]

# The definitions that Challenge.lean copies verbatim (scripts/sync_challenge_defs.py).
[[lean_lib]]
name = "ChallengeDefs"

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
