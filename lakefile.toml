name = "MovingSofa"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["MovingSofa", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"

[[lean_lib]]
name = "MovingSofa"
globs = ["MovingSofa.+"]

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"

# Kept opt-in until local elaboration and the separate axiom audit pass.
# This namespace does not collide with FormalConjectures.Wikipedia.MovingSofa.
[[lean_lib]]
name = "SofaUniqueness"
globs = ["SofaUniqueness.+"]
