name = "MovingSofa"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["MovingSofaOptimality", "MovingSofaUniqueness", "MovingSofaBridge",
  "ChallengeDefs", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"

# The faithful formalization of Baek's paper remains unchanged.
[[lean_lib]]
name = "MovingSofaOptimality"
globs = ["MovingSofaOptimality.+"]

# The original equality/CapKernel uniqueness proof and historical maximizer route.
[[lean_lib]]
name = "MovingSofaUniqueness"
globs = ["MovingSofaUniqueness.+"]

# The stable bridge between formal-conjectures and Baek/Romik definitions.
[[lean_lib]]
name = "MovingSofaBridge"
globs = ["MovingSofaBridge.+"]

# Uncompiled proof source. Deliberately NOT a default target.
[[lean_lib]]
name = "MovingSofaStability"
globs = ["MovingSofaStability.+"]

# Coercive optimality/uniqueness, separated to avoid changing default targets.
[[lean_lib]]
name = "MovingSofaExtremal"
globs = ["MovingSofaExtremal.+"]

# The definitions that Challenge.lean copies verbatim (scripts/sync_challenge_defs.py).
[[lean_lib]]
name = "ChallengeDefs"

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"

# The same Challenge statements via the coercive route; uncompiled, non-default.
[[lean_lib]]
name = "SolutionCoercive"
