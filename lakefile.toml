name = "MovingSofa"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["MovingSofa", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"

[[lean_lib]]
name = "MovingSofa"
globs = ["MovingSofa.+"]

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"

# Source-only uniqueness development remains opt-in.
[[lean_lib]]
name = "SofaUniqueness"
globs = ["SofaUniqueness.+"]

# The exact concrete reference is now proved in ordinary local Lean modules.
# No source exporter or external reference-proof dependency is needed.
# Challenge modules are independent statement environments, not proof imports.
[[lean_lib]]
name = "SofaIntegration"
roots = ["SofaSubmission.Model", "SofaSubmission.ReferenceDefs", "SofaSubmission.ReferenceFacts", "SofaSubmission.Extremal", "SofaSubmission.Uniqueness", "SofaSubmission.Final", "SofaSubmission.SharedChallenge", "SofaSubmission.ChallengeUniqueness"]
globs = ["SofaSubmission.Model", "SofaSubmission.ReferenceDefs", "SofaSubmission.ReferenceFacts", "SofaSubmission.Extremal", "SofaSubmission.Uniqueness", "SofaSubmission.Final", "SofaSubmission.SharedChallenge", "SofaSubmission.ChallengeUniqueness"]
