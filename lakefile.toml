name = "MovingSofa"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["MovingSofaOptimality", "MovingSofaUniqueness", "MovingSofaBridge",
  "MovingSofaStability", "MovingSofaExtremal", "Challenge", "Solution", "BaekEntry"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"

# The formalization of Baek's paper "Optimality of Gerver's sofa".
[[lean_lib]]
name = "MovingSofaOptimality"
globs = ["MovingSofaOptimality.+"]

# The uniqueness of Gerver's sofa, in the definitions of MovingSofaOptimality.
[[lean_lib]]
name = "MovingSofaUniqueness"
globs = ["MovingSofaUniqueness.+"]

# The bridge between the definitions of formal-conjectures and those of Baek's paper, and the
# definitions that both Challenges copy verbatim (MovingSofaBridge.Defs,
# scripts/sync_challenge_defs.py).
[[lean_lib]]
name = "MovingSofaBridge"
globs = ["MovingSofaBridge.+"]

# The stability of Gerver's sofa, in the definitions of MovingSofaOptimality.
[[lean_lib]]
name = "MovingSofaStability"
globs = ["MovingSofaStability.+"]

# Optimality, uniqueness and stability from the coercive certificate of MovingSofaStability, and the
# proofs of the certificate entry: fifteen of its theorems, in the namespace CoerciveSolution
# (MovingSofaExtremal.Statements), the certificate's definitions that Challenge.lean copies verbatim
# (MovingSofaExtremal.CertificateDefs), and its two theorems about the certificate
# (MovingSofaExtremal.Certificate).
[[lean_lib]]
name = "MovingSofaExtremal"
globs = ["MovingSofaExtremal.+"]

# The certificate entry (comparator.json), at the root: optimality, uniqueness and stability through
# the coercive certificate. Its seventeen statements, in Mathlib's vocabulary only.
[[lean_lib]]
name = "Challenge"

# The seventeen theorems under the Challenge's names, for Comparator. No module imports it.
[[lean_lib]]
name = "Solution"

# Baek's entry (baek/comparator.json, registered as PALOMAR-2026-10-02-000008), in baek/: Baek's
# paper with the first proof of uniqueness. Its twelve statements (baek/Challenge.lean) and their
# proofs, with optimality and uniqueness through Baek's Theorem 1.1.1 (baek/Solution.lean). The
# glob selects the modules baek.Challenge and baek.Solution: `.+` takes the submodules of baek
# without a module baek itself, which does not exist (`.*` would take it too).
[[lean_lib]]
name = "BaekEntry"
globs = ["baek.+"]
