name = "MovingSofa"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["MovingSofaOptimality", "MovingSofaUniqueness", "MovingSofaBridge",
  "MovingSofaStability", "MovingSofaExtremal", "ChallengeDefs", "Challenge", "Solution",
  "SolutionCoercive", "SolutionCoerciveComparator"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"

# The formalization of Baek's paper "Optimality of Gerver's sofa".
[[lean_lib]]
name = "MovingSofaOptimality"
globs = ["MovingSofaOptimality.+"]

# The uniqueness of Gerver's sofa, in the definitions of MovingSofaOptimality.
[[lean_lib]]
name = "MovingSofaUniqueness"
globs = ["MovingSofaUniqueness.+"]

# The bridge between the definitions of formal-conjectures and those of Baek's paper.
[[lean_lib]]
name = "MovingSofaBridge"
globs = ["MovingSofaBridge.+"]

# The stability of Gerver's sofa, in the definitions of MovingSofaOptimality.
[[lean_lib]]
name = "MovingSofaStability"
globs = ["MovingSofaStability.+"]

# Optimality, uniqueness and stability from the coercive certificate of MovingSofaStability.
[[lean_lib]]
name = "MovingSofaExtremal"
globs = ["MovingSofaExtremal.+"]

# The definitions that Challenge.lean copies verbatim (scripts/sync_challenge_defs.py).
[[lean_lib]]
name = "ChallengeDefs"

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"

# The theorems of the Challenge, proved through MovingSofaExtremal.
[[lean_lib]]
name = "SolutionCoercive"

# The theorems of SolutionCoercive under the Challenge's names, for Comparator
# (comparator-coercive.json). No module imports it.
[[lean_lib]]
name = "SolutionCoerciveComparator"

# Quantitative extension under development. Not a default target and not yet
# kernel-checked. Existing paper/Challenge verification claims do not cover it.
[[lean_lib]]
name = "MovingSofaQuantitative"
globs = ["MovingSofaQuantitative.+"]
