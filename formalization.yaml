status:
  scope: >-
    Formalized: the coercive certificate (Theorem 11.1 of the manuscript), with Baek's functional Q
    and the enlarged domain of triples restated in the Challenge, and Gerver's triple in that domain,
    where Q = |G|; optimality (Baek's Theorem 1.1.1),
    uniqueness up to a rotation and a translation, and the three stability theorems (Theorems 10.1 to
    10.3 of the manuscript), all proved through the certificate; the existence and uniqueness of the
    solution of Romik's system in the box and the area of Gerver's sofa; the correspondence with
    formal-conjectures' definitions and formal-conjectures' four statements. The proofs use the
    repository's formalization of Baek's paper except his Theorem 1.1.1 and the results of his
    balance argument (Theorems 1.5.2, 4.1.2, 4.1.4, 4.2.5, 6.1.1, 6.3.3, 6.4.3, 6.5.6, Corollary
    6.4.4 and Theorem 8.1.1 (2)), and the parts of the first uniqueness proof that do not use that
    theorem; scripts/AuditCoerciveRoute.lean checks this. The constants of the stability theorems are
    not computed.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

