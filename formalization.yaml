sources:
  - title: "Optimality of Gerver's Sofa"
    authors:
      - "Jineon Baek"
    id: "arXiv:2411.19826v1"
    type: paper
    location: "https://arxiv.org/abs/2411.19826v1"
    relationship: adapts
    note: >-
      The entry uses Baek's framework: the reduction of a moving sofa to a cap, the existence of caps
      of maximal sofa area (Theorems 3.5.5 and 3.5.6), the bound of the sofa area by Q for caps with
      the injectivity condition (Theorem 8.2.4), the rotation angle (Theorem 1.5.1), and his
      definition of Q (Definition 8.2.2), which the Challenge restates. It proves his main theorem
      (Theorem 1.1.1) again without his proof of it: the certificate replaces his maximality of Q at
      Gerver's triple (Theorem 8.4.6, Corollary 8.5.8) and the balance argument of Chapters 4 to 6.
    author_endorsement: not-contacted
  - title: "Stability of Gerver's sofa: notes"
    id: "docs/archive/stability/"
    type: other
    location: "https://github.com/vltanh/lean4-moving-sofa/tree/a8f7719fd43fa91b223d9f6c0eb53594e5a95716/docs/archive/stability"
    relationship: formalizes
    note: >-
      Notes 01-09 on the stability of Gerver's sofa, written by ChatGPT Pro 6 (OpenAI) on 2026-10-05
      at the request of The-Anh Vu-Le, in pull request #8: the enlarged domain of triples, the
      identity that writes |G| - Q as a sum of nonnegative terms, the cap estimate with coefficient
      2 sec phi (note 01), the stability theorem (notes 08, 05, 06, 07) and the optimality of the
      exponent 1/2 (note 09). They have not been peer reviewed. MovingSofaStability/ proves their
      theorems; docs/stability.md describes the proof.
    author_endorsement: n/a
  - title: "The coercive route: notes"
    id: "docs/archive/coercive/"
    type: other
    location: "https://github.com/vltanh/lean4-moving-sofa/tree/8042bad7eb08037f773ea03a635d10ff203e57de/docs/coercive-extremal"
    relationship: formalizes
    note: >-
      Notes on a proof of optimality and uniqueness from two estimates of the stability proof,
      written by ChatGPT Pro 6 (OpenAI) on 2026-10-05 at the request of The-Anh Vu-Le, with
      uncompiled Lean code, in pull request #9. They have not been peer reviewed. The formalization
      states the two estimates as one theorem, the certificate, proves optimality and uniqueness from
      it (MovingSofaExtremal/), and moves the stability proof onto it; docs/coercive.md describes the
      result.
    author_endorsement: n/a
  - title: "Uniqueness of Gerver's sofa: complete paper argument"
    id: "docs/archive/uniqueness/20-complete-paper-proof.md"
    type: other
    location: "https://github.com/vltanh/lean4-moving-sofa/blob/02af5017769d67982a217596b4ad97a10f4f180d/docs/uniqueness/20-complete-paper-proof.md"
    relationship: adapts
    note: >-
      The first proof of uniqueness, written by ChatGPT Pro 6 (OpenAI) on 2026-10-02. This entry
      uses its curvature bounds, its rotation of a maximizing sofa to the right angle and its
      recovery of the sofa from its area, which do not use Baek's Theorem 1.1.1, and replaces its
