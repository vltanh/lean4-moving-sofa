# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

# The Palomar entry at the root of this repository: the Challenge Challenge.lean, the Solution
# Solution.lean, the Comparator configuration comparator.json. The other entry (baek/Challenge.lean,
# baek/Solution.lean, baek/comparator.json, baek/formalization.yaml) formalizes Baek's paper.

project:
  name: "Optimality, uniqueness and stability of Gerver's sofa from one coercive certificate, formalized in Lean 4"
  # The description is shown as plain text that keeps line breaks. Its paragraphs are separated by
  # two empty lines, which this folded block turns into one empty line.
  description: >-
    The moving sofa problem asks for the largest area of a planar shape that can be moved around the
    right-angled corner of a hallway of unit width. Jineon Baek proved (arXiv:2411.19826) that
    Gerver's sofa G, of area 2.2195..., is optimal. His proof bounds the area of every large moving
    sofa by a concave functional Q of a triple (K, B, D) of convex bodies built from a cap K of the
    sofa, and shows that Q is largest at Gerver's triple, where it equals |G|.


    This entry proves one estimate for Q, the coercive certificate, and derives three results from
    it. On an enlarged domain of triples, on which the cap need not satisfy Baek's injectivity
    condition, Q(K, B, D) <= |G|, and the cap K lies within Euclidean Hausdorff distance
    2 sec(phi) sqrt(|G| - Q(K, B, D)) of the horizontal translate of Gerver's cap with the same
    leftmost point, where phi = 0.039... is Gerver's angle. The proof writes |G| - Q as a sum of
    nonnegative terms, and the energy terms among them also bound that distance. The bound is
    attained: Gerver's triple lies in the enlarged domain, and Q equals |G| there.


    From the certificate: optimality, Baek's theorem, proved without his Theorem 1.1.1 and without
    the balance argument of his Chapters 4 to 6; uniqueness, every moving sofa with the area of G is
    mapped onto G by a rotation and a translation (a translation suffices); and stability, after a
    translation a moving sofa of area |G| - epsilon lies within Euclidean Hausdorff distance
    C sqrt(epsilon) of G, their symmetric difference has area at most C' sqrt(epsilon), its rotation
    angle misses a right angle by at most C'' epsilon, and the exponent 1/2 cannot be improved. The
    Challenge also states the correspondence between Baek's definitions and those of Google
    DeepMind's formal-conjectures, and formal-conjectures' statements, among them the uniqueness,
    which it lists as open; here they are proved through the certificate.


    The repository's other Palomar entry, PALOMAR-2026-10-02-000008, formalizes Baek's paper and a
    first proof of uniqueness that uses his Theorem 1.1.1, and states the same optimality, uniqueness
    and formal-conjectures theorems, proved through Baek's argument. A script in the repository,
    scripts/AuditCoerciveRoute.lean, run by the continuous integration, checks that the proofs of
    this entry reach neither Baek's Theorem 1.1.1, nor the results of his balance argument, nor that
    first proof of uniqueness.
  authors:
    - "The-Anh Vu-Le"
  license: "Apache-2.0"
  responsible_maintainers:
    - "The-Anh Vu-Le"

