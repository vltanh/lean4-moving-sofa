    type: other
    location: "https://github.com/vltanh/lean4-moving-sofa/tree/701ec744a73a5fe21c3ac1703ac83cf31df853c2/docs/paper"
    relationship: other
    note: >-
      A manuscript by The-Anh Vu-Le, prepared for arXiv and written from the formalization by AI
