      models: ["Claude Opus 5.5 (claude-opus-5-5)"]
      framework: "Claude Code (Anthropic)"
      tool_setup: >-
        Claude Code 2.1.289, following the formalize-math-paper skill
        (https://github.com/vltanh/formalize-math-paper, versions 2.1.0 and 2.1.1), with sub-agents
        of the same model. It made ChatGPT Pro 6's uncompiled stability code compile (16 sub-agents
        proved again the 123 proofs that failed, and twenty lemmas got back hypotheses that the draft
        had lost), compiled and completed the coercive route (one proof failed), stated the
        certificate as one theorem and moved the stability proof onto it, simplified the libraries
        (8 sub-agents), and wrote this Challenge and Solution, with the certificate's definitions
        copied from the library and bridge lemmas that identify them with the library's.
      cost:
        wall_time: >-
          The stability: about 1 hour (2026-10-05 22:17 to 23:13) and 2 hours 41 minutes (2026-10-06
          07:08 to 09:49). The coercive route: about 3 hours 26 minutes (2026-10-06 09:56 to
          13:22). The simplification: about 2 hours 44 minutes (2026-10-06 13:25 to 16:09). This
          entry's Challenge and Solution, and the move of the other entry into baek/: about 3 hours 17 minutes
          (2026-10-06 19:53 to 23:11), with about 2.8 hours of sub-agent working time.
          docs/CREDITS.md gives the figures of each round.
        spend_usd: "not tracked"
    - method: agent
      models: ["ChatGPT Pro 6 (OpenAI)"]
      framework: "ChatGPT (OpenAI), committing to the repository through GitHub"
      tool_setup: >-
        Wrote the stability argument (docs/archive/stability/) with 85 uncompiled Lean modules (pull
        request #8), and the coercive route (docs/archive/coercive/) with uncompiled Lean code (pull
        request #9), on 2026-10-05; earlier, the first uniqueness proof and its Lean draft (pull
        request #1, 2026-10-02).
      cost:
        spend_usd: "not tracked"
  spend_usd: "not tracked"
  notes: >-
    The arguments of the stability and of the coercive route, and their first Lean code, were
    written by ChatGPT Pro 6; Claude Opus 5.5 made the code compile and completed it, at the request
    of The-Anh Vu-Le, the author and maintainer of this repository. Every result is compiled.
    scripts/Audit.lean checks that every declaration of the libraries uses only propext,
    Classical.choice and Quot.sound, scripts/AuditCoerciveRoute.lean checks the route, and lake
    comparator checks this Challenge/Solution pair with comparator.json.

fidelity:
  divergences: >-
    (1) The Challenge's definitions of Q and of the enlarged domain follow Baek's paper as the
    repository formalizes it: Q is Baek's Definition 8.2.2, the curve areas are Baek's Definitions
    7.2.6 and 7.2.8, the convex curve areas his Theorem 7.3.2, the caps his Definition 2.4.1, and the
    enlarged domain is Baek's domain of triples with the cap in the set of all caps with rotation angle
    pi/2 instead of the caps with the injectivity condition (the stability notes' definition).
    (2) Readings, as in Baek's entry: the plane is R x R and area is Lebesgue measure; the support
    function is a supremum; the surface area measure sigma_K is the Lebesgue-Stieltjes measure of
    t -> <v_K^+(t), v_t> + int_0^t h_K; the curve area functional of a continuous curve of bounded
    variation is (1/2) int x(t) x dx(t), with dx the Lebesgue-Stieltjes vector measure of the curve on
    [a, b]; Gerver's cap is the cap of Gerver's sofa, P_{pi/2} intersected with the closed
    quarter-planes of its supporting hallways. In the Challenge, sigma_K is defined by a case split
    on the monotonicity and right continuity of its distribution function, since a Challenge cannot
    carry the library's proofs of these properties; the Solution proves that it agrees with the
    library's measure on convex bodies, which is where the Challenge uses it.
    (3) The stability: the Euclidean Hausdorff distance of note 08 is stated as EuclideanClose (every
    point of each set within the given distance of a point of the other), which is the same for
    nonempty compact sets; its normalization h(pi/2) = 1, h(pi) = h_G(pi) is stated in the Challenge
    with the highest and leftmost points, and MovingSofaExtremal/Statements.lean proves that the two
    agree. The angle theorem is stated for rotation angles in [arccos(5/11), pi/2], which Baek's
    Theorem 1.5.1 provides.
    The proofs follow the notes' arguments as written in pull request #8's Lean code.
    (4) The uniqueness is stated with a rotation and a translation, as formal-conjectures states it;
    the proof through the certificate also shows that a translation suffices.
review:
  status: "agent-reviewed"
  reviewers:
    - "A Claude Opus 5.5 sub-agent, separate from the repairing agents: a comparison of every repaired stability proof with the uncompiled draft's"
    - "Claude Opus 5.5 sub-agents, separate from the writing agents: comparisons of the manuscript's Sections 10 and 11 with the Lean"
  notes: >-
    No human has reviewed the proofs, the statements or the definitions. Lean's kernel checks the
    proofs, and Comparator checks that the Solution proves the Challenge's statements with the
    standard axioms only, under Lean's kernel and an independent one.

alignment:
  namespaces:
    Baek: "the definitions of Baek's paper (the plane R x R, Romik's description of Gerver's sofa) and of the stability statements"
    Certificate: "Baek's functional Q, the enlarged domain of triples, the caps, and Gerver's cap"
    Bridge: "theorems relating formal-conjectures' definitions to Baek's"
    FormalConjectures.MovingSofa: "the definitions of formal-conjectures, restated with its code"
  statements:
    - source: "Theorem 11.1 of the manuscript docs/paper (the coercive certificate); Baek's Definition 8.2.2 for Q"
      lean: "Certificate.coercive_certificate"
      module: "Challenge"
      status: "proved"
      note: >-
        For every triple (K, B, D) of convex bodies of the enlarged domain (K a cap with rotation angle
        pi/2, not necessarily satisfying Baek's injectivity condition, and B, D as in Baek's domain of
        triples), Baek's upper bound satisfies Q(K, B, D) <= |G|, and K lies within Euclidean
        Hausdorff distance 2 sec(phi) sqrt(|G| - Q(K, B, D)) of Gerver's cap translated horizontally so
        that its leftmost point has the abscissa of the leftmost point of K. Here G is Gerver's sofa,
        Gerver's cap is the cap of G, and phi is Gerver's angle, the parameter phi of Romik's
        solution.
    - source: "Lemma 10.6 of the manuscript (Q <= Q(xi_G) = |G| on the enlarged domain); Baek's Corollary 8.5.8"
      lean: "Certificate.gerver_triple"
      module: "Challenge"
      status: "proved"
      note: >-
        Gerver's cap, with the two tails B and D of Gerver's triple xi_G, lies in the enlarged domain,
        and Q(K_G, B, D) = |G|. So the hypothesis of the certificate can be met, and its bound
        Q <= |G| is attained.
    - source: "Definition 8.1.2 (Gerver's sofa, from Romik's system), existence of the parameters"
      lean: "Baek.gerver_params_exists"
      module: "Challenge"
      status: "proved"
      note: >-
        Romik's system (27)-(44) has a solution with phi in [0.039, 0.04] and theta in [0.68, 0.69].
        Romik finds it numerically; the paper uses it to define Gerver's sofa.
    - source: "Definition 8.1.2, uniqueness of the parameters"
      lean: "Baek.gerver_params_unique"
      module: "Challenge"
      status: "proved"
      note: >-
        The solution in the box is unique, so Gerver's sofa is well defined. Romik asserts uniqueness
        without proof; the paper relies on it.
    - source: "Introduction (Section 1.1), the display |G| = 2.2195... (label eqn:area-bounds)"
      lean: "Baek.gerver_sofa_area"
      module: "Challenge"
      status: "proved"
      note: >-
        The area of the shape defined from Romik's parameters lies in [2.2192, 2.2199], consistent
        with Gerver's value 2.21953.... This identifies the Challenge's definition with Gerver's sofa.
    - source: "Theorem 1.1.1 (thm:main)"
      lean: "Baek.gerver_sofa_optimal"
      module: "Challenge"
      status: "proved"
      note: >-
        Gerver's sofa is a moving sofa (a nonempty, connected, closed set moved by a continuous rigid
        motion from the horizontal to the vertical side of the hallway L, inside L), and every moving
        sofa has area at most the area of Gerver's sofa. The paper's moving sofas are translates of
        subsets of H_L, and its rigid motions are continuous curves in SE(2) starting at a
        translation; Challenge.lean's docstring explains the equivalent formulation used.
        Proved through the certificate (MovingSofaExtremal.gerver_sofa_optimal), without Baek's
        Theorem 1.1.1 and without the results of his balance argument.
    - source: "Uniqueness of Gerver's sofa, docs/archive/uniqueness/20-complete-paper-proof.md, Theorem (not a result of Baek's paper)"
      lean: "Baek.gerver_sofa_unique"
      module: "Challenge"
      status: "proved"
      note: >-
        Every moving sofa whose area equals that of Gerver's sofa is mapped onto Gerver's sofa, as a
        set, by a rotation about the origin followed by a translation. With gerver_sofa_optimal, the
        moving sofas of maximum area are exactly the moving sofas congruent to Gerver's sofa. Proved
        through the certificate (MovingSofaExtremal.image_eq_gerver_of_volume_eq), which also shows
        that a translation suffices.
    - source: "Stability, docs/archive/stability/08-unrestricted-theorem.md, Theorem (1) (not a result of Baek's paper)"
      lean: "Baek.gerver_sofa_stable"
      module: "Challenge"
      status: "proved"
      note: >-
        There are constants C, C', epsilon_0 > 0 such that every moving sofa S whose area is epsilon <
        epsilon_0 less than Gerver's, translated so that its highest point has height 1 and its
        leftmost point the abscissa of Gerver's, lies within Euclidean Hausdorff distance
        C sqrt(epsilon) of Gerver's sofa, and the symmetric difference of the two has area at most
        C' sqrt(epsilon).
    - source: "Stability of the rotation angle, docs/archive/stability/08-unrestricted-theorem.md, Theorem (3)"
      lean: "Baek.gerver_sofa_angle_stable"
      module: "Challenge"
      status: "proved"
      note: >-
        A moving sofa of deficit epsilon < epsilon_0 whose motion turns it clockwise by an angle omega in
        [arccos(5/11), pi/2] has pi/2 - omega <= C epsilon.
    - source: "Optimality of the exponent, docs/archive/stability/09-sharp-exponent.md"
      lean: "Baek.gerver_sofa_stability_exponent"
      module: "Challenge"
      status: "proved"
      note: >-
        For every a > 1/2, C and epsilon_0 > 0, some moving sofa of deficit epsilon in (0, epsilon_0)
        lies within Euclidean Hausdorff distance C epsilon^a of no image of Gerver's sofa by a rotation
        and a translation (Gerver's sofa minus a small open disk).
    - source: "The correspondence between formal-conjectures' moving sofas and Baek's"
      lean: "Bridge.isMovingSofa_iff"
      module: "Challenge"
      status: "proved"
      note: >-
        A set s in EuclideanSpace R (Fin 2) is a moving sofa of formal-conjectures (moved from the
        identity) if and only if it lies in the horizontal side of the hallway and its coordinates
        (p 0, p 1) form a moving sofa of Baek's paper (moved from a translation).
    - source: "The correspondence between formal-conjectures' sofa constant and Baek's optimal area"
      lean: "Bridge.sofaConstant_eq"
      module: "Challenge"
      status: "proved"
      note: >-
        The sofa constant of formal-conjectures is the supremum of the areas of Baek's moving sofas.
    - source: "The correspondence between formal-conjectures' Gerver's sofa and Baek's"
      lean: "Bridge.gerversSofa_eq"
      module: "Challenge"
      status: "proved"
      note: >-
        In coordinates, formal-conjectures' Gerver's sofa, defined from Gerver's four constants, is
        the Gerver's sofa of every solution of Romik's system in the box.
    - source: "formal-conjectures, FormalConjectures/Wikipedia/MovingSofa.lean, GerversSofa.ABφθSpec.existsUnique"
      lean: "FormalConjectures.MovingSofa.GerversSofa.ABφθSpec.existsUnique"
      module: "Challenge"
      status: "proved"
      note: >-
        Gerver's system for the constants A, B, phi, theta (Romik 2018, Equations (1)-(4)) has exactly
        one solution with 0 <= phi <= theta <= pi/4 and A, B >= 0. The definitions of Gerver's sofa in
        formal-conjectures choose this solution.
    - source: "formal-conjectures, FormalConjectures/Wikipedia/MovingSofa.lean, isMovingSofa_gerversSofa"
      lean: "FormalConjectures.MovingSofa.isMovingSofa_gerversSofa"
      module: "Challenge"
      status: "proved"
      note: >-
        Formal-conjectures' Gerver's sofa admits a motion through the hallway from the identity.
    - source: "formal-conjectures, FormalConjectures/Wikipedia/MovingSofa.lean, sofaConstant_eq_volume_gerversSofa"
      lean: "FormalConjectures.MovingSofa.sofaConstant_eq_volume_gerversSofa"
      module: "Challenge"
      status: "proved"
      note: >-
        The sofa constant, the supremum of the areas of moving sofas, is the area of Gerver's sofa.
    - source: "formal-conjectures, FormalConjectures/Wikipedia/MovingSofa.lean, volume_eq_sofaConstant_iff_congruent_gerversSofa (research open there)"
      lean: "FormalConjectures.MovingSofa.volume_eq_sofaConstant_iff_congruent_gerversSofa"
      module: "Challenge"
      status: "proved"
      note: >-
        A moving sofa has area the sofa constant if and only if an isometry of the plane maps Gerver's
        sofa onto it.

acknowledgements: >-
  Mathlib and the Lean toolchain (Lean 4, Lake, Comparator). Google DeepMind's formal-conjectures
  pointed to the uniqueness of the optimal sofa as an open problem.
