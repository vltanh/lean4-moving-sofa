<svg xmlns="http://www.w3.org/2000/svg" width="670" height="382" viewBox="0 0 670 382" role="img" aria-label="The proof of Theorem 4.2.5 for ω = 1.1 and t = π/2 − ω, with a cap K in blue. The corner q0 on the x-axis, the corner r on l(ω, 1) above it, and the point s with |r − s| = 1 give the length g; the point q1 at distance g from o_ω lies on the top side. The hallway with outer walls through q0 and q1 (green) has the triangle Δ_ω (orange) inside its inner quadrant (light orange)">
