<svg xmlns="http://www.w3.org/2000/svg" width="706" height="317" viewBox="0 0 706 317" role="img" aria-label="A long polygon cap K for Θ = {π/4} and ω = π/2, the trapezoid between the lines y = 0 and y = 1 with sides x = y − 1 and x = 9 − y, in blue, and its wedge below the inner corner x_K(π/4), in orange: the polygon niche is the whole wedge, in the fan y ≥ 0; the parallelogram P_ω, the strip below the dashed line, keeps only its darker lower part">
