<svg xmlns="http://www.w3.org/2000/svg" width="572" height="399" viewBox="0 0 572 399" role="img" aria-label="The graphs of k₀(x) = max(|x - 1|, (|x - 1| + 1)/2) and m₀(x) = x - k₀(x) for x from 0 to 3, with the diagonal x dashed. The function m₀ is nondecreasing and piecewise linear, through (0, -1), (2/3, 0), (1, 1/2) and (2, 1), and constant after 2; k₀ has its minimum 1/2 at x = 1">
