<svg xmlns="http://www.w3.org/2000/svg" width="847" height="307" viewBox="0 0 847 307" role="img" aria-label="Gerver's sofa, fixed, with its supporting hallway at the angle t = 0.45 (left) and at π/2 - 0.45 (right). The outer walls a(t) and c(t) meet at the outer corner y(t) and touch the sofa at A(t) and C(t); the inner walls b(t) and d(t) start at the inner corner x(t). On the left the wall d(t) touches the sofa at D(t), on the right the wall b(t) touches it at B(t). The curves traced by A and C, by B and D, and the rotation path x are drawn">
