# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

# The Palomar entry PALOMAR-2026-10-02-000008, whose versions 1 to 4 were registered from the root of
# the repository: the Challenge baek/Challenge.lean, the Solution baek/Solution.lean, the Comparator
# configuration baek/comparator.json. The entry at the root (Challenge.lean, Solution.lean,
# comparator.json, formalization.yaml) is the coercive certificate.

project:
  name: "Optimality (Baek 2024) and uniqueness of Gerver's sofa, formalized in Lean 4"
  # The description is shown as plain text that keeps line breaks. Its paragraphs are separated by
  # two empty lines, which this folded block turns into one empty line.
  description: >-
    The moving sofa problem asks for the largest area of a planar shape that can be moved around the
    right-angled corner of a hallway of unit width. This repository formalizes in Lean 4, with
    Mathlib, Jineon Baek's proof (arXiv:2411.19826) that Gerver's sofa, of area 2.2195..., is optimal:
    the numbered results of the paper (the few that the proofs do not need are listed in baek/REPORT.md,
    Section 9), the results it cites (Schneider's area formula for convex
    bodies, and the existence and uniqueness of the solution of Romik's equations, which define
    Gerver's sofa), and the structure of Gerver's sofa (Theorem 8.4.1), which the paper states without
    proof.


    It also proves that Gerver's sofa is the only moving sofa of maximum area up to rigid motions: a
    rotation followed by a translation maps every moving sofa of that area onto Gerver's sofa. Baek's
    paper does not prove this.


    It proves that Gerver's sofa is stable, and it derives optimality, uniqueness and stability
    from one estimate for Baek's upper bound, a coercive certificate; that work is the repository's
    other Palomar entry, at its root (formalization.yaml), whose Challenge states it.


    Finally, it bridges Baek's definitions and those of Google DeepMind's formal-conjectures: the two
    notions of moving sofa agree, the sofa constant of formal-conjectures is the supremum of the areas
    of Baek's moving sofas, and the two definitions of Gerver's sofa, from Gerver's four constants and
    from Romik's equations, give the same set. Gerver's four constants are proved unique by elementary
    inequalities. Formal-conjectures' statements follow, including the uniqueness, which it lists as
    open.
  authors:
    - "The-Anh Vu-Le"
  license: "Apache-2.0"
  responsible_maintainers:
    - "The-Anh Vu-Le"

classification:
  arxiv: ["math.MG", "math.OC"]
  msc2020: ["49Q10", "52A10", "52A38", "52A40", "68V20"]

sources:
  - title: "Optimality of Gerver's Sofa"
    authors:
      - "Jineon Baek"
    id: "arXiv:2411.19826v1"
    type: paper
    location: "https://arxiv.org/abs/2411.19826v1"
    relationship: formalizes
    note: >-
      The formalization follows version 1 of the preprint (the only version), audited against its
      LaTeX source. Statements that are false or meaningless as printed are formalized in their
      intended form; baek/REPORT.md (Sections 3 and 6) lists every correction.
    author_endorsement: not-contacted
  - title: "Uniqueness of Gerver's sofa: complete paper argument"
    id: "docs/archive/uniqueness/20-complete-paper-proof.md"
    type: other
    location: "https://github.com/vltanh/lean4-moving-sofa/blob/02af5017769d67982a217596b4ad97a10f4f180d/docs/uniqueness/20-complete-paper-proof.md"
    relationship: formalizes
    note: >-
      An informal proof that every moving sofa with the area of Gerver's sofa is congruent to it,
      written by ChatGPT Pro 6 (OpenAI) on 2026-10-02 at the request of The-Anh Vu-Le, with the notes
      before it in docs/archive/uniqueness/. It has not been peer reviewed. It relies on Baek's paper, which
      does not prove uniqueness. The formalization (MovingSofaUniqueness/) proves its theorem and
      its six propositions; baek/proof/ (Chapters 11 and 12) gives the proof with the Lean form of
      each step and the places where the formal proof takes a different route.
    author_endorsement: n/a
  - title: "Differential Equations and Exact Solutions in the Moving Sofa Problem"
    authors:
      - "Dan Romik"
    id: "doi:10.1080/10586458.2016.1270858"
    type: paper
    location: "Experimental Mathematics 27 (2018), no. 3, 316-330; arXiv:1606.08111"
    relationship: background
    note: >-
      Gerver's sofa is defined, in the paper and in the Challenge, from Romik's rotation path,
      Equations (25)-(44) and (8). Romik solves the system numerically and asserts without proof that
      the solution is unique. The existence of the solution, and its uniqueness in the box
      phi in [0.039, 0.04], theta in [0.68, 0.69], are proved here (MovingSofaOptimality/External/Romik.lean).
    author_endorsement: not-contacted
  - title: "On Moving a Sofa around a Corner"
    authors:
      - "Joseph L. Gerver"
    id: "doi:10.1007/BF02414066"
    type: paper
    location: "Geometriae Dedicata 42 (1992), no. 3, 267-283"
    relationship: background
    note: >-
      Constructs the sofa and conjectures its optimality. The paper quotes Gerver's Theorem 1 for
      context and cites Gerver's Theorem 2 in the proof of Theorem 6.1.2, which is proved here from
      Romik's equations instead (baek/REPORT.md, E12).
    author_endorsement: not-contacted
  - title: "Convex Bodies: The Brunn-Minkowski Theory (2nd edition)"
    authors:
      - "Rolf Schneider"
    id: "doi:10.1017/CBO9781139003858"
    type: book
    location: "Encyclopedia of Mathematics and Its Applications 151, Cambridge University Press, 2013"
    relationship: background
    note: >-
      The paper cites several facts from this book. The area formula |K| = (1/2) int h_K d sigma_K
      (Remark 5.1.2, Eq. (5.19)) is proved in MovingSofaOptimality/External/AreaFormula.lean. The other cited
      facts, such as the weak convergence of surface area measures (the paper's Theorem 4.1.3), are
      proved where they are used or taken from Mathlib (baek/REPORT.md, Section 2).
    author_endorsement: n/a
  - title: "Problem 66-11, Moving Furniture Through a Hallway"
    authors:
      - "Leo Moser"
    type: paper
    location: "SIAM Review 8 (1966), no. 3, 381"
    relationship: background
    note: "The origin of the moving sofa problem; context only."
    author_endorsement: n/a

related_formalizations:
  - id: "https://github.com/google-deepmind/formal-conjectures/blob/main/FormalConjectures/Wikipedia/MovingSofa.lean"
    relationship: other
    note: >-
      Google DeepMind's formal-conjectures states the optimality (solved) and the uniqueness
      (category research open, volume_eq_sofaConstant_iff_congruent_gerversSofa) with different
      definitions: moving sofas in EuclideanSpace R (Fin 2) moved from the identity, the optimal area
      as a supremum, and Gerver's sofa from Gerver's four constants. The Challenge restates its
      definitions and its four statements in the namespace FormalConjectures.MovingSofa, states three
      theorems relating its definitions to Baek's (namespace Bridge, proved in MovingSofaBridge/), and
      derives the four statements from Baek's theorems through them.
  - id: "https://github.com/deancureton/MovingSofa"
    relationship: other
    note: >-
      An earlier Lean 4 formalization of the same paper, written by AI coding agents directed by
      Dean Cureton. It proves the formal-conjectures statement sofaConstant = volume gerversSofa,
      with Gerver's description of the sofa and vendored libraries. docs/prior-work.md compares the
      two.
  - id: "https://github.com/RuifengCao/sofa-formal"
    relationship: other
    note: >-
      An earlier Lean 4 formalization of the same paper. It proves the formal-conjectures statement
      sofaConstant = volume gerversSofa, with Gerver's description of the sofa. docs/prior-work.md
      compares the two.

status:
  scope: >-
    Formalized: the numbered results of Chapters 1-8 of the paper, except those listed below, the
    main theorem (Theorem 1.1.1),
    and the existence and uniqueness of Gerver's parameters in the stated box. Also formalized: the
    results from the literature that the proofs use (Schneider's area formula, the solution of
    Romik's system, the weak convergence of surface area measures, Blaschke selection via Mathlib),
    and Theorem 8.4.1, which the paper states without proof. The paper's statements that are false
    or meaningless as printed (baek/REPORT.md, E1, E3, E6, E7, E9, E11, E13, E18, E21, E23, E25, E26)
    are formalized in their intended form, and Theorem 3.1.2 gets the boundedness hypothesis that
    the paper leaves out (baek/REPORT.md, Section 4); no other result is weakened. Not formalized, because the
    formalization does not use them: the Jordan curve theorem and the area enclosed by a Jordan curve
    (Theorems 7.2.1, 7.2.3, Proposition 7.2.7), whose uses are replaced by direct area computations;
    Schneider's Theorem 4.2.3 in its Hausdorff-measure form (the paper's Theorem 2.1.1), where the
    surface area measure is defined directly and the properties the paper uses are proved; the
    quotation of Gerver's Theorem 1 (Theorem 1.3.1), whose parts that the paper uses it reproves in
    Chapter 3; and the remarks (except Remark 2.5.2) and figures. Also formalized: the uniqueness of the optimal sofa up to rigid
    motions (MovingSofaUniqueness/), with the theorem and the six propositions of
    docs/archive/uniqueness/20-complete-paper-proof.md. Not formalized there: the quantitative stability
    estimate of note 17, which the theorem does not use. The repository also proves the stability of
    Gerver's sofa and derives optimality, uniqueness and stability from one coercive certificate; the
    Palomar entry at its root (formalization.yaml) states these results. Also
    formalized: the bridge between
    formal-conjectures' definitions and Baek's (MovingSofaBridge/): the two notions of moving sofa,
    the two optimal areas and the two Gerver's sofas agree, and Gerver's four constants are unique on
    their whole domain; formal-conjectures' four statements follow.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: agent
      models: ["Claude Opus 5.5 (claude-opus-5-5)"]
      framework: "Claude Code (Anthropic)"
      tool_setup: >-
        Baek's paper: Claude Code 2.1.285, with one coordinating agent and 19 sub-agents of the same
        model (at most 13 running at once), each sub-agent owning a group of files. The work followed
        the formalize-math-paper skill (https://github.com/vltanh/formalize-math-paper, commit
        cbdedac): statements first, then proofs, verification, cleanup and the audit. The agents had
        a Lean 4 and Lake toolchain, a local Mathlib checkout, Python with NumPy, SciPy, SymPy and
        mpmath for the numerics, and the paper's arXiv LaTeX source. Two Lean files of interval
        arithmetic are generated by Python scripts kept in the repository (scripts/romik,
        scripts/area). Uniqueness: Claude Code 2.1.287 with the same skill (version 1.3.0) compiled
        ChatGPT Pro's Lean draft, replaced its 54 failing proofs by sorry, and had them proved again
        by 8 sub-agents, starting from the draft's proofs; a ninth sub-agent reviewed the statements
        against the informal proof. The connection with formal-conjectures: the same session ported
        ChatGPT Pro 6's draft, and 7 sub-agents proved its 78 failing proofs again; one more checked
        the analytic argument numerically and the definitions against formal-conjectures, and one
        cleaned up. Consolidation: a later Claude Code 2.1.287 session merged the uniqueness and
        bridge libraries from 75 files into 12 modules, removed the declarations that no final
        theorem uses, made the bridge independent of the optimality and uniqueness theorems, and
        restated it in the Challenge; one sub-agent rewrote the documentation of the uniqueness
        modules. Simplification: a later Claude Code 2.1.287 session, with one coordinating agent and
        26 sub-agents of the same model (at most 18 running at once), merged about 190 duplicated
        helper lemmas into the Basic modules, simplified every file, split the file of Baek's §3.4
        into four modules and unified the interval arithmetic of the two generated files (the three
        libraries went from 50,304 to 45,783 lines; no statement of the Challenge or of a numbered
        result changed), fixed the axiom audit's list of imports, audited the illustrated text
        against the Lean statements, and checked that the proofs still follow Baek's arguments
        (REPORT.md now records every departure, in section 7). Following Baek's proofs: the same
        session, with version 1.4.0 of the skill (commit e37a7ea) and 21 sub-agents of the same model
        (at most 6 running at once), added a route check (scripts/route_check.py, in CI) that
        compares the numbered results each Lean proof uses with those Baek's proof cites, extracted
        from the LaTeX source; three sub-agents reviewed the differences against the LaTeX source by
        chapter and fixed about thirty proofs, nine rewrote about 25 proofs along Baek's arguments,
        and three compared every changed proof with the LaTeX source. Three statements changed to
        match the paper (Theorem 8.5.2 regained its hypothesis b < a + pi; Lemma 6.2.4 lost an unused
        hypothesis; Theorem 8.4.3 (2) gained the curve-area equalities of "as oriented curves").
        What's next: the same session, with version 2.1.0 of the skill (commit 397f71c) and 3
        sub-agents, one at a time, wrote the report's What's next section from a literature search,
        moved the run log to CREDITS.md, added to the audit the twelve findings of another
        formalization's notes that it had missed, and restored two statements (Lemma 7.1.6, Theorem
        8.4.1 (4)) that were weaker than the paper's. Stability: Claude Code 2.1.289, with version
        2.1.0 of the skill, compiled ChatGPT Pro 6's 85 Lean modules (pull request #8): every
        statement was made to elaborate, the 123 proofs that failed were proved again by 16
        sub-agents starting from the draft's proofs, and a seventeenth compared every repaired proof
        with the draft's. Twenty lemmas were false as compiled, because Lean 4 leaves out of a
        statement the section variables it does not mention; their hypotheses are now included.
        The Challenge then gained the three stability theorems. The coercive route: the same session
        compiled ChatGPT Pro 6's Lean modules of pull request #9 (one proof failed), moved the
        stability proof onto the route, stated the certificate and the theorem that gives the three
        results together, extended the second solution to the fifteen statements, and rewrote and
        ran its audit (scripts/AuditCoerciveRoute.lean, in CI). Simplifying the new libraries: the
        same session gave the two new proofs of optimality one shared assembly, merged the 86 files
        of the stability library into eleven modules and removed the declarations that no theorem
        uses; 8 sub-agents (at most 8 running at once), each on its own copy of the build, then
        rewrote the modules, keeping the name and statement of every declaration used elsewhere.
        The stability library went from 12,550 to 7,585 lines; Baek's library, the bridge, the
        Challenge and the proofs of Solution.lean did not change.
      cost:
        wall_time: >-
          Baek's paper: about 3 hours 50 minutes of elapsed time to the audited formalization
          (2026-10-01 22:38 to 2026-10-02 02:28, US Central Time), with about 18 hours of sub-agent
          working time; the Palomar packaging came afterwards. Uniqueness: about 1 hour of elapsed
          time from ChatGPT Pro's draft to the documented proof (2026-10-02 21:55 to 22:56), with
          about 0.9 hours of sub-agent working time. Connection with formal-conjectures: about 1 hour
          (2026-10-02 23:05 to 2026-10-03 00:02), with about 1.3 hours of sub-agent working time.
          Consolidation: about 1 hour 5 minutes (2026-10-03 07:48 to 08:53), with about 0.4 hours of
          sub-agent working time. Simplification: about 3 hours 10 minutes (2026-10-03 12:35 to
          15:45), with about 12.5 hours of sub-agent working time. Following Baek's proofs: about
          4 hours 15 minutes (2026-10-03 16:30 to 20:45), with about 6.3 hours of sub-agent working
          time. What's next: about 1 hour 6 minutes (2026-10-03 20:46 to 21:52), with about 0.8 hours of
          sub-agent working time. Stability: about 1 hour (2026-10-05 22:17 to 23:13), with about 2.3
          hours of sub-agent working time. The coercive route, with the manuscript's section on it: about
          3 hours 26 minutes (2026-10-06 09:56 to 13:22), with about 3.8 hours of sub-agent working time.
          Simplifying the new libraries, with the manuscript's revision: about 2 hours 44 minutes
          (2026-10-06 13:25 to 16:09), with about 7.1 hours of sub-agent working time. Comparator for
          the second solution, and the manuscript reorganized: about 45 minutes (2026-10-06 16:13 to
